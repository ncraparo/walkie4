<style>
:root {
  color-scheme: light dark;
  --bg: #dfe5e2;
  --surface: #ecf0ee;
  --field: #f6f8f7;
  --ink: #15232b;
  --muted: #566a73;
  --line: #b4c2bc;
  --tx: #d93b14;
  --rx: #0f7f62;
  --key: #15232b;
  --key-ink: #eef3f1;
  --key-edge: #070d10;
  --danger: #b3261e;
  --font: "Barlow Semi Condensed", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10181c;
    --surface: #18232a;
    --field: #0e1519;
    --ink: #e6eef0;
    --muted: #8fa5ae;
    --line: #2c3c45;
    --tx: #ff6a3d;
    --rx: #35c9a1;
    --key: #e6eef0;
    --key-ink: #10181c;
    --key-edge: #8da1a9;
    --danger: #ff8a80;
  }
}
:root[data-theme="dark"] {
  --bg: #10181c;
  --surface: #18232a;
  --field: #0e1519;
  --ink: #e6eef0;
  --muted: #8fa5ae;
  --line: #2c3c45;
  --tx: #ff6a3d;
  --rx: #35c9a1;
  --key: #e6eef0;
  --key-ink: #10181c;
  --key-edge: #8da1a9;
  --danger: #ff8a80;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-weight: 500;
  font-size: 18px;
  line-height: 1.35;
  -webkit-text-size-adjust: 100%;
}
.app {
  height: 100%;
  max-width: 480px;
  margin: 0 auto;
  padding: 18px 22px 22px;
  display: flex;
  flex-direction: column;
}
#join { display: flex; flex-direction: column; min-height: 0; }
h1 {
  font-size: 52px;
  line-height: 0.95;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin: 28px 0 14px;
}
.lede { color: var(--muted); font-size: 20px; margin: 0 0 30px; max-width: 26ch; }
label { display: block; font-weight: 600; font-size: 17px; margin: 0 0 6px; }
.hint { color: var(--muted); font-size: 15px; font-weight: 500; margin: 6px 0 0; }
input {
  width: 100%;
  height: 54px;
  padding: 0 16px;
  border-radius: 12px;
  border: 2px solid var(--line);
  background: var(--field);
  color: var(--ink);
  font: inherit;
  font-size: 20px;
  font-weight: 600;
}
input:focus-visible, button:focus-visible { outline: 3px solid var(--rx); outline-offset: 3px; }
.field { margin-bottom: 22px; }
.primary {
  width: 100%;
  height: 60px;
  border: 0;
  border-radius: 14px;
  background: var(--key);
  color: var(--key-ink);
  font: inherit;
  font-size: 22px;
  font-weight: 700;
  box-shadow: 0 5px 0 var(--key-edge);
  cursor: pointer;
}
.primary:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--key-edge); }
.primary:disabled { opacity: .6; }
.note { min-height: 1.4em; margin: 16px 0 0; color: var(--danger); font-size: 16px; font-weight: 600; }
.fine { margin-top: auto; color: var(--muted); font-size: 15px; padding-top: 18px; }
.linkbtn {
  background: none; border: 0; color: var(--muted); font: inherit; font-weight: 600;
  font-size: 17px; padding: 10px 4px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
}
.invite { align-self: flex-start; margin-top: 8px; }

/* radio screen */
.radio { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.chip {
  font-size: 17px; font-weight: 600; padding: 6px 14px; border-radius: 999px;
  border: 2px solid var(--line); background: var(--surface); max-width: 60%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.status { font-size: 34px; line-height: 1.05; font-weight: 700; margin: 26px 0 16px; min-height: 2.1em; }
.meter { display: flex; align-items: center; gap: 4px; height: 52px; }
.meter i {
  flex: 1; height: 100%; border-radius: 3px; background: var(--line);
  transform: scaleY(.12); transform-origin: 50% 50%; transition: background .2s;
}
.radio[data-mode="tx"] .meter i { background: var(--tx); animation: lvl .8s ease-in-out infinite; animation-delay: calc(var(--i) * -.11s); }
.radio[data-mode="rx"] .meter i { background: var(--rx); animation: lvl .8s ease-in-out infinite; animation-delay: calc(var(--i) * -.11s); }
.meter i:nth-child(3n) { animation-duration: .6s !important; }
.meter i:nth-child(3n+1) { animation-duration: 1.05s !important; }
@keyframes lvl { 0%, 100% { transform: scaleY(.15); } 50% { transform: scaleY(1); } }

.keywrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 12px 0 8px; }
.ptt {
  position: relative;
  width: min(72vw, 310px);
  aspect-ratio: 1;
  border-radius: 50%;
  border: 0;
  padding: 0;
  background: var(--key);
  color: var(--key-ink);
  font: inherit;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 12px 0 var(--key-edge), 0 24px 34px rgba(0,0,0,.22);
  transition: transform .07s ease, box-shadow .07s ease, background .12s ease;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
}
.ptt::before {
  content: ""; position: absolute; inset: 16px; border-radius: 50%;
  border: 2px solid currentColor; opacity: .28; pointer-events: none;
}
.ptt svg { width: 56px; height: 56px; pointer-events: none; }
.ptt span { font-size: 34px; font-weight: 700; line-height: 1; pointer-events: none; }
.ptt:disabled { cursor: default; opacity: .55; }
.radio[data-mode="tx"] .ptt {
  background: var(--tx); color: #fff;
  transform: translateY(10px); box-shadow: 0 2px 0 var(--key-edge), 0 8px 16px rgba(0,0,0,.22);
}
.radio[data-mode="rx"] .ptt { opacity: 1; animation: ring 1.4s ease-in-out infinite; }
@keyframes ring {
  0%, 100% { box-shadow: 0 12px 0 var(--key-edge), 0 0 0 5px var(--rx); }
  50% { box-shadow: 0 12px 0 var(--key-edge), 0 0 0 14px var(--rx); }
}
.sound { margin: 0 auto; }
@media (prefers-reduced-motion: reduce) {
  .meter i, .ptt { animation: none !important; transition: none; }
  .radio[data-mode="tx"] .meter i, .radio[data-mode="rx"] .meter i { transform: scaleY(.75); }
}
@media (max-height: 640px) { h1 { font-size: 40px; margin-top: 14px; } .lede { margin-bottom: 18px; } .status { font-size: 28px; margin: 14px 0 10px; } }

/* voice effects */
.fx { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 2px 0 4px; }
.fxbtn {
  min-height: 48px; padding: 6px 4px; border-radius: 12px;
  border: 2px solid var(--line); background: var(--surface); color: var(--ink);
  font: inherit; font-size: 14px; font-weight: 700; letter-spacing: .02em; line-height: 1.1;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.fxbtn[aria-pressed="true"] { background: var(--key); border-color: var(--key); color: var(--key-ink); }
@media (max-height: 760px) { .ptt { width: min(60vw, 250px); } }
@media (max-height: 700px) { .ptt { width: min(54vw, 220px); } }
@media (max-height: 640px) { .ptt { width: min(46vw, 180px); } .ptt svg { width: 40px; height: 40px; } .ptt span { font-size: 26px; } }
@media (max-height: 580px) { .ptt { width: min(40vw, 150px); } }

/* conversation log */
.radio { position: relative; }
.barbtns { display: flex; align-items: center; gap: 8px; }
.logbtn {
  padding: 6px 14px; border-radius: 999px; border: 2px solid var(--line);
  background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; font-weight: 700;
  letter-spacing: .04em; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.logbtn[aria-pressed="true"] { background: var(--key); border-color: var(--key); color: var(--key-ink); }
.chip { max-width: 48%; }
.log {
  position: absolute; left: 0; right: 0; top: 52px; z-index: 5;
  background: #0b1114; color: #e6eef0; border: 1px solid #2c3c45; border-radius: 12px;
  padding: 8px 10px 6px; font-size: 11.5px; line-height: 1.35;
  box-shadow: 0 10px 30px rgba(0,0,0,.35);
}
.log-body { max-height: 150px; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.log-body .day { color: #8fa5ae; font-weight: 700; margin: 0 0 3px; }
.log-body .row { display: grid; grid-template-columns: 1fr auto; column-gap: 8px; align-items: end; margin: 0 0 3px; }
.log-body .msg { overflow-wrap: anywhere; }
.log-body .msg b { font-weight: 700; }
.log-body .time { color: #8fa5ae; font-variant-numeric: tabular-nums; white-space: nowrap; }
.log-foot { display: flex; align-items: center; gap: 8px; margin-top: 4px; padding-top: 4px; border-top: 1px solid #1e2b32; font-size: 10px; line-height: 1.25; color: #8fa5ae; }
.log-state { flex: 1; min-width: 0; max-height: 2.5em; overflow: hidden; }
.log-copy { background: none; border: 0; color: #8fa5ae; font: inherit; text-decoration: underline; padding: 2px 0; cursor: pointer; }
</style>
</head>
<body>
<main class="app">

  <section id="join">
    <h1>Walkie Talkie</h1>
    <p class="lede">Hold the button to talk. The other person hears you live.</p>

    <div class="field">
      <label for="name">Your name</label>
      <input id="name" type="text" maxlength="24" autocomplete="off" autocapitalize="words" placeholder="Nick">
    </div>
    <div class="field">
      <label for="channel">Channel code</label>
      <input id="channel" type="text" maxlength="12" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
      <p class="hint">Use at least 4 letters or numbers. Your partner enters the same code.</p>
      <button id="inviteBtn" class="linkbtn invite" type="button">Send invite link</button>
    </div>

    <button id="joinBtn" class="primary" type="button">Join channel</button>
    <p id="joinNote" class="note" role="status" aria-live="polite"></p>
    <p class="fine">Your microphone stays muted until you hold the button. Anyone with your channel code can join, so keep it private.</p>
  </section>

  <section id="radio" class="radio" data-mode="wait" hidden>
    <div class="bar">
      <div class="chip" id="chLabel">Channel</div>
      <div class="barbtns">
        <button id="logBtn" class="logbtn" type="button" aria-pressed="false" aria-controls="log">LOG</button>
        <button id="leaveBtn" class="linkbtn" type="button">Leave</button>
      </div>
    </div>
    <div id="log" class="log" role="region" aria-label="Conversation log" hidden>
      <div id="logBody" class="log-body"></div>
      <div class="log-foot"><span id="logState" class="log-state"></span><button id="logCopy" class="log-copy" type="button">Copy</button></div>
    </div>

    <div id="status" class="status" role="status" aria-live="polite">Setting up the channel…</div>
    <div class="meter" id="meter" aria-hidden="true"></div>
    <p id="radioNote" class="note" role="status" aria-live="polite"></p>

    <div class="keywrap">
      <button id="ptt" class="ptt" type="button" disabled aria-label="Hold to talk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="2.5" width="6" height="12" rx="3"></rect>
          <path d="M5 11.5a7 7 0 0 0 14 0"></path>
          <path d="M12 18.5V22"></path>
        </svg>
        <span id="pttLabel">Waiting…</span>
      </button>
    </div>
    <div class="fx" role="group" aria-label="Voice effects">
      <button class="fxbtn" type="button" data-fx="low" aria-pressed="false">LOW-PITCH</button>
      <button class="fxbtn" type="button" data-fx="high" aria-pressed="false">HIGH-PITCH</button>
      <button class="fxbtn" type="button" data-fx="super" aria-pressed="false">SUPER-HIGH-PITCH</button>
    </div>
    <button id="soundBtn" class="linkbtn sound" type="button" hidden>Tap to turn on sound</button>
  </section>

</main>
<audio id="remoteAudio" autoplay playsinline></audio>

<script>
(function () {
  "use strict";

  /* ===== RELAY SETTINGS =====
     A relay server passes the audio along when two phones can't connect
     directly (for example when they're on different networks). These
     come from your Metered dashboard. To stop using the relay, empty
     both quotes. */
  var RELAY_USERNAME = "1a4450a5f3266086bbde4e98";
  var RELAY_PASSWORD = "msq96P8t0jKDSx9j";
  /* ====================================== */

  var ICE_SERVERS = [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" }
  ];
  if (RELAY_USERNAME && RELAY_PASSWORD) {
    ICE_SERVERS = [
      { urls: "stun:stun.relay.metered.ca:80" },
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "turn:global.relay.metered.ca:80", username: RELAY_USERNAME, credential: RELAY_PASSWORD },
      { urls: "turn:global.relay.metered.ca:80?transport=tcp", username: RELAY_USERNAME, credential: RELAY_PASSWORD },
      { urls: "turn:global.relay.metered.ca:443", username: RELAY_USERNAME, credential: RELAY_PASSWORD },
      { urls: "turns:global.relay.metered.ca:443?transport=tcp", username: RELAY_USERNAME, credential: RELAY_PASSWORD }
    ];
  }

  function relayAdvice() {
    if (!RELAY_USERNAME || !RELAY_PASSWORD) return " A relay server fixes that.";
    return " The relay is on, so try reloading both pages and check your Metered usage hasn\u2019t run out.";
  }

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    join: $("join"), radio: $("radio"), name: $("name"), channel: $("channel"),
    joinBtn: $("joinBtn"), inviteBtn: $("inviteBtn"), joinNote: $("joinNote"),
    radioNote: $("radioNote"), chLabel: $("chLabel"), leaveBtn: $("leaveBtn"),
    status: $("status"), meter: $("meter"), ptt: $("ptt"), pttLabel: $("pttLabel"),
    soundBtn: $("soundBtn"), audio: $("remoteAudio")
  };

  /* ---------- state ---------- */
  var state = { joined: false, ch: "", name: "" };
  var peer = null, mySlot = 0, claimTries = 0, svcDown = false, fatalMsg = "";
  var dc = null, dcOpen = false, call = null, hasStream = false, dialStartedAt = 0;
  var dialT = null, watchT = null, lastSeen = 0;
  var waitHintT = null, lastUnavail = 0, blockedDials = 0;
  var localStream = null, micTrack = null;
  var iTalk = false, remoteTalking = false, partnerName = "";
  var audioCtx = null, wake = null, joining = false;

  /* ---------- helpers ---------- */
  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function cleanCode(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 12); }
  function idFor(ch, n) { return "wtpt-" + ch + "-" + n; }
  function linkUp() { return dcOpen && hasStream; }
  function randomCode() {
    var chars = "abcdefghjkmnpqrstuvwxyz23456789", out = "";
    for (var i = 0; i < 6; i++) out += chars.charAt(Math.floor(Math.random() * chars.length));
    return out;
  }

  for (var i = 0; i < 18; i++) {
    var b = document.createElement("i");
    b.style.setProperty("--i", i);
    els.meter.appendChild(b);
  }

  els.name.value = safeGet("wt-name") || "";
  var fromLink = cleanCode((location.hash || "").replace(/^#/, ""));
  els.channel.value = fromLink || safeGet("wt-channel") || randomCode();

  /* ---------- sounds ---------- */
  function beep(freqs, dur) {
    if (!audioCtx) return;
    try {
      var t = audioCtx.currentTime;
      freqs.forEach(function (f, i) {
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = "sine"; o.frequency.value = f;
        var s = t + i * dur;
        g.gain.setValueAtTime(0.0001, s);
        g.gain.exponentialRampToValueAtTime(0.28, s + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(s); o.stop(s + dur + 0.02);
      });
    } catch (e) {}
  }

  function playRemote() {
    var p = els.audio.play();
    if (p && p.then) {
      p.then(function () { els.soundBtn.hidden = true; }).catch(function () { els.soundBtn.hidden = false; });
    }
  }

  /* ---------- rendering ---------- */
  function render() {
    if (!state.joined) return;
    var up = linkUp();
    var nm = partnerName || "Your partner";
    var status, mode, label;
    if (fatalMsg) { status = "Can\u2019t start the channel"; mode = "wait"; label = "Unavailable"; }
    else if (svcDown && !up) { status = "Reconnecting to the connection service…"; mode = "wait"; label = "Waiting…"; }
    else if (!mySlot) { status = "Setting up the channel…"; mode = "wait"; label = "Waiting…"; }
    else if (!dcOpen) { status = "Waiting for your partner on channel \u201C" + state.ch + "\u201D"; mode = "wait"; label = "Waiting…"; }
    else if (!up) { status = nm + " is here. Connecting audio…"; mode = "wait"; label = "Connecting…"; }
    else if (iTalk) { status = "You\u2019re talking"; mode = "tx"; label = "Talking…"; }
    else if (remoteTalking) { status = nm + " is talking"; mode = "rx"; label = "Channel busy"; }
    else { status = "Connected to " + nm; mode = "idle"; label = "Hold to talk"; }
    els.status.textContent = status;
    els.radio.dataset.mode = mode;
    els.pttLabel.textContent = label;
    els.ptt.disabled = !(mode === "idle" || mode === "tx");
    els.ptt.setAttribute("aria-label", label);
  }

  function setRadioNote(msg) { els.radioNote.textContent = msg || ""; }

  /* ---------- messages over the data connection ---------- */
  function sendMsg(o) {
    try { if (dc && dcOpen) dc.send(o); } catch (e) {}
  }
  function onMsg(d) {
    if (!d || typeof d !== "object") return;
    if (d.t === "hi" && typeof d.name === "string") { partnerName = d.name.slice(0, 24); partnerLog = d.log === true; render(); }
    else if (d.t === "talk") { onRemoteTalking(d.on === true); }
    else if (d.t === "log") { partnerLog = d.on === true; }
    else if (d.t === "say") { onSay(d, partnerName || "Partner"); }
  }

  /* ---------- talking ---------- */
  function startTalk() {
    if (iTalk || !state.joined || !linkUp() || !micTrack) return;
    if (remoteTalking) { beep([260], 0.14); return; }
    iTalk = true;
    micTrack.enabled = true;
    startRec();
    sendMsg({ t: "talk", on: true });
    render();
  }
  function stopTalk() {
    if (!iTalk) return;
    iTalk = false;
    if (micTrack) micTrack.enabled = false;
    stopRec();
    sendMsg({ t: "talk", on: false });
    render();
  }
  function onRemoteTalking(on) {
    if (on === remoteTalking) return;
    remoteTalking = on;
    if (on && logOn && !partnerLog) flashLogState((partnerName || "Your partner") + "\u2019s text sharing is off.");
    if (on) { stopTalk(); beep([880, 1320], 0.06); playRemote(); }
    else { beep([1320, 880], 0.05); }
    render();
  }

  els.ptt.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    if (els.ptt.disabled) return;
    try { els.ptt.setPointerCapture(e.pointerId); } catch (err) {}
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    playRemote();
    startTalk();
  });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach(function (t) {
    els.ptt.addEventListener(t, stopTalk);
  });
  els.ptt.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  els.ptt.addEventListener("selectstart", function (e) { e.preventDefault(); });
  window.addEventListener("keydown", function (e) {
    if (e.code !== "Space" || e.repeat || !state.joined) return;
    var tag = document.activeElement && document.activeElement.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    e.preventDefault(); startTalk();
  });
  window.addEventListener("keyup", function (e) { if (e.code === "Space") stopTalk(); });
  els.soundBtn.addEventListener("click", function () {
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    playRemote();
  });

  document.addEventListener("visibilitychange", function () {

    var ch = cleanCode(els.channel.value);
    if (ch.length < 4) { els.joinNote.textContent = "Enter a channel code of at least 4 letters or numbers first."; return; }
    var url = location.href.split("#")[0] + "#" + ch;
    try {
      if (navigator.share) {
        await navigator.share({ title: "Walkie Talkie", text: "Join my walkie-talkie channel", url: url });
        return;
      }
    } catch (e) { if (e && e.name === "AbortError") return; }
    try {
      await navigator.clipboard.writeText(url);
      els.joinNote.style.color = "var(--rx)";
      els.joinNote.textContent = "Invite link copied.";
      setTimeout(function () { els.joinNote.textContent = ""; els.joinNote.style.color = ""; }, 2500);
    } catch (e) {
      els.joinNote.textContent = "Copy this link: " + url;
    }
  }

  els.joinBtn.addEventListener("click", join);
  els.leaveBtn.addEventListener("click", leave);
  els.inviteBtn.addEventListener("click", invite);
  els.channel.addEventListener("keydown", function (e) { if (e.key === "Enter") join(); });
  window.addEventListener("pagehide", function () {
    try { if (peer) peer.destroy(); } catch (e) {}
    if (localStream) localStream.getTracks().forEach(function (t) { t.stop(); });
  });
})();
</script>
</body>
</html>
